name: Canary

# Is this library still working against the real AliExpress?
#
# Three suites, because they fail for different reasons and need different
# dependencies:
#
#   core  — search, paging, sorting, filters, locale, product detail
#   cli   — the published command line contract: exit codes, stream separation,
#           --fields, the machine-readable schema
#   mint  — the optional ./baxia entry point, which needs JSDOM from npm
#
# Each reports one of three outcomes, and they are deliberately not treated
# alike:
#
#   0  everything that ran, passed.
#   3  AliExpress refused everything, so nothing was exercised. GitHub's egress
#      IPs are a plausible target for that, and it says nothing about our code,
#      so the job warns and passes. Filing an issue here would train everyone to
#      ignore this workflow. A run where only some checks were refused still
#      exits 0 and names them in the summary.
#   4  requests succeeded but fields we depend on stopped arriving. That is real:
#      the normalizer is silently returning nulls, and an issue is filed.

on:
  schedule:
    # 03:00 UTC daily. Frequent enough to catch drift within a day, rare enough
    # not to look like scraping.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: Search term to probe with
        required: false
        default: usb cable

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Probe the library
        id: core
        env:
          AE_CANARY_QUERY: ${{ inputs.query || 'usb cable' }}
        run: |
          set +e
          deno task canary | tee -a report.md
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probe the CLI
        id: cli
        run: |
          set +e
          printf '\n\n### CLI\n\n' >> report.md
          deno task canary:cli | tee -a report.md
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      # The mint suite is the only thing here that needs npm packages, so it runs
      # last: a failure to install must not cost us the core results.
      - name: Probe the cookie mint
        id: mint
        run: |
          set +e
          printf '\n\n### Mint\n\n' >> report.md
          deno task canary:mint | tee -a report.md
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Combine outcomes
        id: verdict
        env:
          CODES: ${{ steps.core.outputs.code }} ${{ steps.cli.outputs.code }} ${{ steps.mint.outputs.code }}
        run: |
          # Drift anywhere outranks everything else; "blocked" only stands when
          # nothing at all got through.
          verdict=3
          for code in $CODES; do
            if [ "$code" = "4" ] || [ "$code" = "1" ] || [ "$code" = "2" ]; then verdict=4; break; fi
            if [ "$code" = "0" ]; then verdict=0; fi
          done
          echo "code=$verdict" >> "$GITHUB_OUTPUT"
          echo "suites: $CODES -> verdict $verdict"

      - name: Publish the report
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Blocked, not broken
        if: steps.verdict.outputs.code == '3'
        run: |
          echo "::warning title=Canary blocked::AliExpress refused every request from this \
          runner. The library was not exercised, so nothing can be concluded about it."

      - name: Report drift
        if: steps.verdict.outputs.code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary: AliExpress behaviour changed"

          # One issue per outage. Re-filing daily would bury the original
          # investigation under duplicates.
          existing=$(gh issue list --state open --label canary --json number --jq '.[0].number')

          {
            echo "The live canary failed."
            echo
            echo "Suite exit codes — core: ${{ steps.core.outputs.code }}, \
          cli: ${{ steps.cli.outputs.code }}, mint: ${{ steps.mint.outputs.code }}"
            echo
            echo "Exit 4 means AliExpress answered but something we depend on stopped"
            echo "working — a field the normalizer reads, a request parameter that is now"
            echo "ignored, or a CLI contract. The report below names it."
            echo
            cat report.md
            echo
            echo "[Workflow run]($RUN_URL)"
          } > body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label canary --body-file body.md
          fi

      - name: Close a resolved drift issue
        if: steps.verdict.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --label canary --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Canary is passing again; closing."
          fi

      - name: Fail the job on drift
        if: steps.verdict.outputs.code == '4'
        run: exit 1
