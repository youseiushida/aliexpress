name: CI

# Everything here is offline and deterministic: it runs against frozen fixtures
# and never touches AliExpress, so a failure always means our code changed.
# Whether AliExpress still behaves is the canary workflow's job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Kept as separate steps so a red build says which gate failed at a glance.
      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts cli/main.ts src/baxia.ts tests/live/canary.ts tests/live/cli.ts tests/live/mint.ts

      - name: Unit tests
        run: deno test --allow-read tests/unit/

      - name: Verify the package is publishable
        run: deno publish --dry-run
